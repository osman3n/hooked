name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # no dependencies to install: the game and every tool are dependency-free
      - name: unit + integration self-test
        run: node tools/selftest.mjs
      - name: balance report
        run: node tools/balance.mjs
